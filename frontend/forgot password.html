
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Forgot Password — Dream</title>
		<script src="src/api.js?v=20260902"></script>
		<script>
			tailwindConfig = { theme: { extend: { colors: { primary: '#5a67d8', 'primary-dark': '#434190', success: '#22c55e', 'success-dark': '#16a34a' } } } }
		</script>
		<script src="https://cdn.tailwindcss.com"></script>
		<style>
			body {
				background: linear-gradient(135deg, #5a67d8 0%, #434190 100%);
			}
		</style>
	</head>
	<body class="antialiased text-gray-800 min-h-screen flex items-center justify-center">
		<div class="w-full max-w-md mx-auto bg-white rounded-xl shadow-lg p-8">
			<div class="mb-6 text-center">
				<img src="assets/DIT LOGO1.png" alt="Dream logo" class="h-12 w-auto mx-auto mb-2 object-contain" />
				<h2 class="text-2xl font-bold text-primary mb-2">Forgot Password</h2>
				<p class="text-gray-500">Enter your email address and we'll send you instructions to reset your password.</p>
			</div>
			<form id="forgot-form" class="space-y-5">
				<div>
					<label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
					<input required type="email" id="email" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm p-2" placeholder="you@example.com" />
				</div>
				<button type="submit" class="w-full px-4 py-2 bg-green-500 text-white rounded-md text-sm font-medium hover:bg-green-600 block">Send Reset Link</button>
				<div id="forgot-message" class="mt-4 text-center text-sm"></div>
			</form>
			<div class="mt-6 text-center">
				<a href="login.html" class="text-primary font-bold hover:underline">Back to Login</a>
			</div>
		</div>
		<script>
			document.getElementById('forgot-form').addEventListener('submit', async function(e) {
				e.preventDefault();
				const email = document.getElementById('email').value;
				const message = document.getElementById('forgot-message');
				message.textContent = '';
				message.className = 'mt-4 text-center text-sm';
				if (!email) {
					message.textContent = 'Please enter your email address.';
					message.classList.add('text-red-500');
					return;
				}
				try {
					const res = await fetch(window.DREAM_API + '/api/forgot-password', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ email })
					});
					let data = {};
					try {
						data = await res.json();
					} catch (jsonErr) {
						message.textContent = 'Unexpected server response.';
						message.classList.add('text-red-500');
						return;
					}
					if (res.ok) {
						message.textContent = 'If this email is registered, you will receive a password reset link.';
						message.classList.add('text-green-500');
					} else if (data && data.error) {
						message.textContent = data.error;
						message.classList.add('text-red-500');
					} else {
						message.textContent = 'Failed to send reset link. Please try again.';
						message.classList.add('text-red-500');
					}
				} catch (err) {
					message.textContent = 'Network error. Please check your connection or try again later.';
					message.classList.add('text-red-500');
				}
			});
		</script>
		<script src="src/app.js"></script>
	</body>
</html>
