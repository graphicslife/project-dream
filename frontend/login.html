<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/responsive.css" />
    <title>Login — Dream</title>
    <link rel="stylesheet" href="assets/login.css" />
    <script src="src/api.js?v=20260902" defer></script>
    <script src="src/engagement.js?v=20260902" defer></script>
    <style>
      body {
        background: linear-gradient(135deg, #f4f7ff 0%, #eef4ff 35%, #f8fafc 100%);
      }

      .login-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }

      .login-card {
        width: min(100%, 620px);
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 26px;
        box-shadow: 0 24px 65px rgba(15, 23, 42, 0.12);
        padding: 40px 48px;
      }

      .login-header {
        text-align: center;
        margin-bottom: 22px;
      }

      .brand-mark {
        width: 62px;
        height: 62px;
        margin: 0 auto 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: linear-gradient(135deg, #5a67d8 0%, #434190 100%);
        color: #fff;
        font-weight: 800;
        font-size: 1.1rem;
        box-shadow: 0 12px 24px rgba(90, 103, 216, 0.2);
      }

      .login-header h1 {
        margin: 0;
        color: #1f2937;
        font-size: clamp(2rem, 3vw, 2.5rem);
        letter-spacing: -0.05em;
      }

      .login-header p {
        margin: 10px 0 0;
        color: #5b6478;
        font-size: 0.95rem;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        color: #374151;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      input, select {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #dfe7f3;
        background: #f8fbff;
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 0.97rem;
        color: #111827;
        transition: all 0.2s ease;
      }

      input:focus, select:focus {
        outline: none;
        border-color: rgba(90, 103, 216, 0.8);
        box-shadow: 0 0 0 4px rgba(90,103,216,0.10);
        background: #fff;
      }

      .secondary-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: -4px;
      }

      .secondary-row a,
      .switch-link {
        color: #4f46e5;
        text-decoration: none;
        font-weight: 600;
      }

      .secondary-row a:hover,
      .switch-link:hover {
        text-decoration: underline;
      }

      .submit-btn {
        border: none;
        border-radius: 14px;
        padding: 15px 18px;
        background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        color: #fff;
        font-weight: 800;
        font-size: 0.98rem;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(34,197,94,0.20);
      }

      #login-message {
        min-height: 22px;
        font-size: 0.92rem;
        font-weight: 700;
      }

      .text-danger { color: #dc2626; }
      .text-success { color: #15803d; }

      .switch-box {
        text-align: center;
        margin-top: 18px;
        color: #5b6478;
        font-size: 0.94rem;
      }

      .switch-box a {
        color: #4f46e5;
        text-decoration: none;
        font-weight: 700;
      }

      @media (max-width: 560px) {
        .login-shell {
          padding: 20px 14px;
        }

        .login-card {
          padding: 28px 20px 24px;
          border-radius: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-card">
        <div class="login-header">
          <div class="brand-mark">D</div>
          <h1>Welcome</h1>
          <p>Sign in to continue to Dream</p>
        </div>

        <form id="login-form">
          <div class="field">
            <label for="role">Role / Position</label>
            <select id="role">
              <option value="member">Member</option>
              <option value="admin">Admin</option>
              <option value="coordinator">Program Coordinator</option>
              <option value="mobilizer">Community Mobilizer</option>
              <option value="partner">Development Partner</option>
            </select>
          </div>

          <div class="field">
            <label for="username">Email or Username</label>
            <input required type="text" id="username" placeholder="you@example.com" />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input required type="password" id="password" placeholder="Enter your password" />
          </div>

          <div class="secondary-row">
            <a href="forgot password.html">Forgot password?</a>
            <a href="index.html">Back home</a>
          </div>

          <button type="submit" class="submit-btn">Login</button>
          <div id="login-message"></div>
        </form>

        <div class="switch-box">
          Don’t have an account? <a href="register.html">Sign up</a>
        </div>
      </div>
    </div>

    <script>
      window.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('login-form');
        if (!form) return;

        form.addEventListener('submit', async function(e) {
          e.preventDefault();
          const role = document.getElementById('role').value;
          const identifier = document.getElementById('username').value.trim();
          const password = document.getElementById('password').value;
          const message = document.getElementById('login-message');

          if (!identifier) {
            message.textContent = 'Email or username is required.';
            message.className = 'text-danger';
            return;
          }

          const payload = { password, role };
          if (identifier.includes('@')) {
            payload.email = identifier;
          } else {
            payload.username = identifier;
          }

          try {
            const res = await fetch(window.DREAM_API + '/api/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            let data = {};
            try {
              data = await res.json();
            } catch (jsonErr) {
              message.textContent = `Unexpected server response: ${jsonErr.message}`;
              message.className = 'text-danger';
              return;
            }

            if (res.ok && data && data.user) {
              fetch(window.DREAM_API + `/api/profile/${data.user.id}`, {
                method: 'GET',
                credentials: 'include'
              })
                .then(r => r.json())
                .then(profile => {
                  if (profile && profile.role) {
                    data.user.role = profile.role;
                    localStorage.setItem('dream_user', JSON.stringify(data.user));
                  }
                  message.textContent = 'Login successful!';
                  message.className = 'text-success';
                  setTimeout(() => {
                    if (data.user.role === 'admin' || data.user.role === 'super_admin') {
                      window.location.href = 'admin.html';
                    } else {
                      window.location.href = 'profile.html';
                    }
                  }, 1200);
                })
                .catch(() => {
                  localStorage.setItem('dream_user', JSON.stringify(data.user));
                  message.textContent = 'Login successful!';
                  message.className = 'text-success';
                  setTimeout(() => {
                    window.location.href = 'profile.html';
                  }, 1200);
                });
            } else if (data && data.error) {
              message.textContent = data.error;
              message.className = 'text-danger';
            } else {
              message.textContent = `Login failed: ${res.status} ${res.statusText}`;
              message.className = 'text-danger';
            }
          } catch (err) {
            message.textContent = `Network error: ${err.message}`;
            message.className = 'text-danger';
          }
        });
      });
    </script>
    <script src="src/app.js"></script>
  </body>
</html>
