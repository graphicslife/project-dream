              <span class="text-lg font-semibold hidden sm:inline">Dream</span>
            </a>
            <ul class="hidden md:flex space-x-6 items-center text-gray-700">
              <li><a href="index.html" class="hover:text-primary">Home</a></li>
              <li><a href="about.html" class="hover:text-primary">About Us</a></li>
              <li><a href="programs.html" class="hover:text-primary">Programs</a></li>
              <li><a href="gallery.html" class="hover:text-primary">Gallery</a></li>
              <li><a href="donation.html" class="hover:text-primary">Donation</a></li>
            </ul>
          </div>
          <div class="flex items-center">

              <a href="login.html" class="px-4 py-2 bg-white border border-gray-300 rounded-md text-sm font-medium hover:bg-gray-50">Login</a>

            <button id="nav-toggle" class="md:hidden inline-flex items-center justify-center p-2 rounded-md text-gray-600 hover:bg-gray-100 focus:outline-none">
              <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>

        <div id="mobile-menu" class="md:hidden hidden px-2 pb-4">
          <ul class="space-y-1">
            <li><a href="index.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-gray-100">Home</a></li>
            <li><a href="about.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-gray-100">About Us</a></li>

    <main class="pt-24 max-w-7xl mx-auto px-6 lg:px-8">
      <section class="text-center py-12">
        <h2 class="text-3xl font-bold text-primary mb-4">Our Programs & Projects</h2>
        <div id="programs-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
      </section>
    </main>
    <script>
      const API = window.DREAM_API;
      const localPrograms = [
        { title: 'Ramadan Iftar with Children', description: 'Sharing warm iftar meals, kindness, and dignity with orphaned and vulnerable children throughout the holy month of Ramadan.', image_url: 'assets/_52B9087.jpg', status: 'active' },
        { title: 'Education for Every Child', description: 'School supplies, learning support, and encouragement that help children stay in class and believe in their future.', image_url: 'assets/IMG_0068.JPG', status: 'active' },
        { title: 'Health & Family Support', description: 'Community health outreach and practical support that help families grow stronger, healthier, and more secure.', image_url: 'assets/IMG_0077.JPG', status: 'active' }
      ];
      async function fetchPrograms() {
        const container = document.getElementById('programs-list');
        let programs = [];
        try {
          const res = await fetch(API + '/api/programs');
          if (res.ok) programs = await res.json();
        } catch (error) {
          programs = [];
        }
        programs = Array.isArray(programs) && programs.length ? programs : localPrograms;
        container.innerHTML = programs.map(function(p) {
          var div = document.createElement('div');
          div.className = 'bg-white rounded-lg shadow p-6 flex flex-col items-center';
          let url = p.image_url;
          if (url && !url.startsWith('http')) url = API + url;
          if (p.image_url && p.image_url.startsWith('assets/')) url = p.image_url;
          div.innerHTML =
            '<img src="' + (url || 'assets/IMG_0076.jpg') + '" alt="Program Image" class="w-24 h-24 rounded object-cover mb-4 border" />' +
            '<h3 class="font-bold text-lg mb-2">' + p.title + '</h3>' +
            '<p class="text-gray-600 mb-2">' + p.description + '</p>' +
            '<span class="text-xs px-2 py-1 rounded-full ' + (p.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-800') + '">' + p.status + '</span>';
          return div.outerHTML;
        }).join('');
      }
      window.addEventListener('DOMContentLoaded', fetchPrograms);
    </script>
    <script src="src/app.js"></script>
  </body>
</html>
